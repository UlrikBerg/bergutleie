# Cloudflare Workers – konfigurasjon for bergutleie.no
#
# Nettstedet er statiske filer i dist/ (bygget av bygg.js).
# Worker-koden i src/index.js kjører bare for det som ikke er en fil –
# i praksis kun POST /api/foresporsel.

name = "bergutleie"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Vipps-endepunktet er ingen hemmelighet, så det står her framfor som secret.
# Lokalt overstyrer .dev.vars denne med testmiljøet – wrangler lar .dev.vars
# vinne i dev, slik at `wrangler dev` aldri treffer produksjon ved et uhell.
[vars]
VIPPS_API = "https://api.vipps.no"

[assets]
directory = "./dist"
binding = "ASSETS"
# Serverer dist/404.html når adressen ikke finnes
not_found_handling = "404-page"
# Worker-koden må kjøre før filene, ellers ville www.bergutleie.no fått
# servert index.html direkte og aldri blitt omdirigert til apex-domenet.
run_worker_first = true

# Teller for tilbudsnummer. Uten den faller nummeret tilbake på klokka,
# og da hopper det - kunden ser at det ikke er fortløpende.
[[kv_namespaces]]
binding = "TELLER"
id = "7a176560b5e7488db87a9fac4b4668d5"
